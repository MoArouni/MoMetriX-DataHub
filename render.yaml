services:
  - type: web
    name: mometrix-datahub
    env: python
    runtime: python-3.11
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel
      python -m pip install -r requirements.txt
      chmod +x start.sh
    startCommand: ./start.sh
    autoDeploy: true
    envVars:
      - key: FLASK_CONFIG
        value: "production"



