<!-- Sales Overview -->
<div class="card mb-4">
    <div class="card-header">
        <h2>Sales Overview</h2>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <p class="stat-value">${{ "%.2f"|format(total_sales) }}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <p class="stat-value">{{ total_orders }}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Average Order Value</h3>
                    <p class="stat-value">${{ "%.2f"|format(avg_order_value) }}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3>Top Product</h3>
                    <p class="stat-value">{{ top_product }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Sales Trends -->
<div class="card mb-4">
    <div class="card-header">
        <h2>Sales Trends</h2>
    </div>
    <div class="card-body">
        <div class="chart-container">
            <img src="data:image/png;base64,{{ sales_trend_chart }}" alt="Sales Trends" class="img-fluid">
        </div>
    </div>
</div>
